<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>말씀 상고 · 모바일 미리보기(390px)</title>
<style>
  html,body{margin:0;padding:0;background:#3a3f47;font-family:sans-serif}
  .wrap{display:flex;justify-content:center;padding:16px 0}
  .phone{width:390px;height:844px;border-radius:26px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#000}
  iframe{width:390px;height:844px;border:0;display:block}
</style>
</head>
<body>
<div class="wrap"><div class="phone">
<iframe id="f"></iframe>
</div></div>
<script>
(function () {
  var SRC = 'https://raw.githubusercontent.com/darameee2/malssum-counter/8fb18c78d315728525e5a2454f8d4963a73378de/index.html';
  fetch(SRC, { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (t) { document.getElementById('f').srcdoc = t; })
    .catch(function (e) { document.body.insertAdjacentHTML('beforeend', '<pre>' + e + '</pre>'); });
})();
</script>
</body>
</html>
